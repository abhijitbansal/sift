name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the repo and runs tests; it never needs
# write scopes. Fork PRs already get a read-only token, but pinning it here keeps
# the default from widening later.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --dev  # fail fast if uv.lock has drifted

      - name: Run tests
        run: uv run python -m pytest

      - name: Coverage gate (>= 80%)
        run: uv run python -m pytest --cov=sift --cov-fail-under=80 -q
