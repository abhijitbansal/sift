# Sift configuration. The ANTHROPIC_API_KEY never goes here — env or keychain only.

[sift]
model = "claude-opus-4-8"
# Thinking off: the ranking output is schema-constrained, so adaptive thinking
# mostly burned tokens (~21k/run) for little gain. "off" keeps cost ~$0.12/run on
# Opus. Set to "adaptive" (optionally with effort = "low".."max") if you want it.
thinking = "off"
max_items_per_digest = 10

# Absolute base URL of the published site, with a trailing slash. Used to build
# absolute og:url / og:image so pasted links unfurl as a titled, large-image
# card in Microsoft Teams / Slack.
site_url = "https://abhijitbansal.github.io/sift/"

# Watchlist: entities/topics to up-weight in ranking so they surface more
# reliably. The single Claude call raises their importance score and keeps them
# even when borderline. Leave empty ([]) to disable.
boost = ["Ford"]

interest_profile = """
I care about enterprise AI adoption (real deployments, not press-release vapor),
agentic software development and dev tooling (coding agents, SDLC automation,
evals, agent harnesses), major model releases and capabilities research, and AI
infrastructure including compute, chips, datacenters, and energy. I prefer
primary sources and concrete numbers over hype. I am less interested in consumer
chatbot drama, AI doom punditry, and incremental product marketing.
"""

# Anthropic has no official RSS feed; this is a community-maintained mirror.
[[feeds]]
name = "Anthropic News"
url = "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"
category_hint = "models_research"

[[feeds]]
name = "OpenAI News"
url = "https://openai.com/news/rss.xml"
category_hint = "models_research"
# Down-weighted: a prolific vendor feed (1000+ items/run) that otherwise dominates.
weight = 0.6

[[feeds]]
name = "Google DeepMind Blog"
url = "https://deepmind.google/blog/rss.xml"
category_hint = "models_research"

[[feeds]]
name = "Google AI Blog"
url = "https://blog.google/technology/ai/rss/"
category_hint = "models_research"

# Meta's ai.meta.com blog feed is dead; the engineering blog AI category works.
[[feeds]]
name = "Meta Engineering (AI Research)"
url = "https://engineering.fb.com/category/ai-research/feed/"
category_hint = "models_research"

[[feeds]]
name = "Hacker News Front Page"
url = "https://hnrss.org/frontpage"
# Down-weighted: a general aggregator with lots of non-AI noise.
weight = 0.5

[[feeds]]
name = "Simon Willison"
url = "https://simonwillison.net/atom/everything/"
category_hint = "tooling"

[[feeds]]
name = "Import AI"
url = "https://importai.substack.com/feed"
category_hint = "policy"

[[feeds]]
name = "arXiv cs.AI"
url = "https://rss.arxiv.org/rss/cs.AI"
category_hint = "models_research"

[[feeds]]
name = "Interconnects AI"
url = "https://www.interconnects.ai/feed"

[[feeds]]
name = "SemiAnalysis"
url = "https://www.semianalysis.com/feed"

[[feeds]]
name = "Latent.Space"
url = "https://www.latent.space/feed"

[[feeds]]
name = "The Pragmatic Engineer"
url = "https://newsletter.pragmaticengineer.com/feed"

[[feeds]]
name = "One Useful Thing"
url = "https://www.oneusefulthing.org/feed"

[[feeds]]
name = "Ahead of AI"
url = "https://magazine.sebastianraschka.com/feed"

[[feeds]]
name = "Hugging Face - Blog"
url = "https://huggingface.co/blog/feed.xml"

[[feeds]]
name = "Andrej Karpathy blog"
url = "https://karpathy.github.io/feed.xml"

# X has no open RSS, so Sift reads it through a bridge that turns a handle into a
# feed. {handle} is substituted by `sift add-x <handle>`. nitter.net works today
# but public Nitter instances are unstable — swap this for a self-hosted Nitter /
# RSSHub, or an RSS.app feed URL, if it stops resolving.
[x]
bridge_url = "https://nitter.net/{handle}/rss"

[[feeds]]
name = "X · @karpathy"
url = "https://nitter.net/karpathy/rss"

[[feeds]]
name = "X · @DrJimFan"
url = "https://nitter.net/DrJimFan/rss"

[[feeds]]
name = "X · @ylecun"
url = "https://nitter.net/ylecun/rss"
